<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Вхід</title>
    <style>
      body {
        font-family: Arial, sans-serif;
      }
      .container {
        max-width: 300px;
        margin: auto;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <nav>
      <ul>
        <li><a href="index.html">Додому</a></li>
        <li><a href="register.html">Реєстрація</a></li>
      </ul>
    </nav>
    <div class="container">
      <h2>Вхід</h2>
      <form id="loginForm">
        <input
          type="tel"
          id="tel"
          name="phone"
          pattern="(\+?38)?(0\d{9})"
          title="Введіть коректний номер телефону України"
          value="+380"
          placeholder="+380123456789"
        /><br /><br />
        <input
          type="password"
          id="password"
          placeholder="Пароль"
          required
        /><br /><br />
        <button type="submit">Увійти</button>
      </form>
    </div>
  </body>
  <script src="login.js"></script>
</html>
